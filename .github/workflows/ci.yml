name: Dakar Bus CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend and GTFS tests
        run: npm run test:all

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
